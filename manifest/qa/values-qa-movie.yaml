# Environnement: QA — Service: movie
# Rôle: paramètres d’image, probes et variables d’environnement pour Helm.

replicaCount: 1

image:
  repository: sparaccae/movie-service
  tag: "qa"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

# Probes adaptées au service movie (endpoints réels FastAPI)
probes:
  livenessPath: "/api/v1/movies/docs"
  readinessPath: "/api/v1/movies/openapi.json"

# Variables d’environnement
env:
  # DB locale au namespace qa (Service: movie-db)
  DATABASE_URI: "postgresql://movie_db_username:movie_db_password@movie-db/movie_db_qa"
  # URL interne vers l’API cast (nom de release Helm = "exam-cast" → Service exposé sur port 80)
  CAST_SERVICE_HOST_URL: "http://exam-cast-fastapiapp/api/v1/casts/"
