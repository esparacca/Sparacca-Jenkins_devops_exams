version: '3.7'

services:
  # API "movie" (FastAPI) — construit l'image depuis ./movie-service
  movie_service:
    build: ./movie-service
    # Démarre l'app FastAPI avec Uvicorn en mode reload (pratique en dev local)
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    # Montage du code local dans le conteneur pour un dev à chaud
    volumes:
      - ./movie-service/:/app/
    # Expose le service sur localhost:8001 → conteneur:8000
    ports:
      - 8001:8000
    # Variables nécessaires au démarrage:
    # - DATABASE_URI: chaîne de connexion Postgres (service movie_db défini plus bas)
    # - CAST_SERVICE_HOST_URL: URL interne pour joindre l'API cast
    environment:
      - DATABASE_URI=postgresql://movie_db_username:movie_db_password@movie_db/movie_db_dev
      - CAST_SERVICE_HOST_URL=http://cast_service:8000/api/v1/casts/
    # Lance movie_db avant ce service (ordre de démarrage)
    depends_on:
      - movie_db

  # Base de données Postgres pour "movie"
  movie_db:
    image: postgres:12.1-alpine
    # Volume persistant pour conserver les données entre redémarrages
    volumes:
      - postgres_data_movie:/var/lib/postgresql/data/
    # Identifiants/DB créés au démarrage
    environment:
      - POSTGRES_USER=movie_db_username
      - POSTGRES_PASSWORD=movie_db_password
      - POSTGRES_DB=movie_db_dev

  # API "cast" (FastAPI) — construit l'image depuis ./cast-service
  cast_service:
    build: ./cast-service
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    volumes:
      - ./cast-service/:/app/
    # Expose le service sur localhost:8002 → conteneur:8000
    ports:
      - 8002:8000
    # DATABASE_URI pour la base "cast"
    environment:
      - DATABASE_URI=postgresql://cast_db_username:cast_db_password@cast_db/cast_db_dev
    depends_on:
      - cast_db

  # Base de données Postgres pour "cast"
  cast_db:
    image: postgres:12.1-alpine
    volumes:
      - postgres_data_cast:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=cast_db_username
      - POSTGRES_PASSWORD=cast_db_password
      - POSTGRES_DB=cast_db_dev

  # Proxy Nginx (dev) — route le trafic vers les deux APIs
  nginx:
    image: nginx:latest
    # Expose Nginx sur localhost:8080
    ports:
      - "8080:8080"
    # Charge la configuration Nginx locale (routes vers movie/cast)
    volumes:
      - ./nginx_config.conf:/etc/nginx/conf.d/default.conf
    # Assure que les APIs soient démarrées avant Nginx
    depends_on:
      - cast_service
      - movie_service

volumes:
  # Volumes persistants pour Postgres (movie et cast)
  postgres_data_movie:
  postgres_data_cast:
