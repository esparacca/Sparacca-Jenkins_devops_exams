# Environnement PROD — service cast
replicaCount: 3

image:
  repository: docker.io/sparaccae/cast-service
  tag: "prod"
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

probes:
  livenessPath: "/api/v1/casts"
  readinessPath: "/api/v1/casts"
