# Environnement QA — service movie
replicaCount: 1

image:
  repository: docker.io/sparaccae/movie-service
  tag: "qa"
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

probes:
  livenessPath: "/api/v1/movies"
  readinessPath: "/api/v1/movies"
