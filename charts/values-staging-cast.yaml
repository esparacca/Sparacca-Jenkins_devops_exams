# Environnement STAGING — service cast
replicaCount: 1

image:
  repository: docker.io/sparaccae/cast-service
  tag: "staging"
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

probes:
  livenessPath: "/api/v1/casts"
  readinessPath: "/api/v1/casts"
